schema_version = 2

[board]
name = "zeus"
soc = "SM8450"
description = "Xiaomi 12 Pro (zeus)"
# The device package is linked as kits/<kit>. build-sheng-source-storage.py
# (the sheng UFS runtime builder) hardcodes kits/sheng when it runs from the
# assembled tree, so the kit folder must carry that name; the board itself is
# zeus (Xiaomi 12 Pro), derived from obaosp/UniXNU-cupid. This only changes the package folder, not any output name.
kit = "sheng"
soc_source = "sm8450"
# iPhone-flavoured iOS 27 profile. The profile is shipped in this repository
# under profiles/os/ and installed into the UniXNU checkout by
# scripts/install-os-profile.sh; UniXNU main does not carry it yet.
os_profile = "ios-27.0.1-24A446"

[userdata]
# Measured on zeus (TWRP, root, 2026-11-16): /dev/block/by-name/userdata ->
# /dev/block/sda38, start 25362432 and size 466862040 512-byte sectors, logical
# block 4096 -> 4096-byte LBA first 3170304, count 58357755, last 61528058.
# Identical to cupid's layout.
first_lba = 3170304
last_lba = 61528058
lba_bytes = 4096


[components]
# Stage 0. ArmDTPlatform, ArmCpu and XnuPrelink also come from the arm64e arch
# profile; they are repeated here because arrays replace inherited arrays.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengUfs", "RamBlock", "GopFramebuffer"]

[kernel]
defconfig = "zeus_ios27_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-fileset-release-reference.py --tree . --lto",
  "component:ShengUfs",
  "component:RamBlock",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ipados-27.0.1-24A446",
  # Display: aston's iPhone17,2 (d94ap) IOMobileFramebufferLegacy binding on the firmware GOP framebuffer, CPU path.
  "build-zeus-legacy-display-27.py",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8450.config", "os:configs/ios.config"]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu-12377/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
  "device:patches/xnu-12377/series",
]

[device_tree]
source = "device:dts/zeus.dts"
include_dirs = ["soc:dts"]

[firmware]
# amethyst8118/uefi-zeus (branch zeus): obaosp's uefi-cupid fork plus zeusPkg,
# the cupidPkg platform with zeus's 1440x3200 framebuffer and identity.
# Minimal vendor-HW-off configuration on WaipioPkg (SM8450).
config = "zeus"
dsc = "Platforms/Xiaomi/zeusPkg/zeus.dsc"
fd = "Build/zeusPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Gic-Spurious masks interrupts with no registered handler (as sheng does).
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
# Binaries is deliberately absent: zeusPkg runs with ZEUS_VENDOR_HW = 0 and
# needs no stock vendor module.
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "zeus"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "zeus-ios27"

[bootimg]
dtb = "build/zeus/zeus.dtb"
# The zeus live FDT (dts/live/zeus-live.dtb) already carries
# /reserved-memory/splash_region, so no dtb_node override (fdtput refuses an
# existing node).

[payload]
volume = "ZEUSESP"
size_mib = 176
loader = "firmware"
title = "iOS 27"
dram_size = "0x80000000"
panic_screen = true
# UFS root on: the kernel takes its root from the SHNGROOT windows in userdata.
# With Android data still in userdata the driver only reads the GPT and LBA
# 3170304 and rejects the missing manifest (cupid notes/ROOT-UFS.md).
# zeus-panic-after=300 (patches/xnu-12377/zeus-panic-after.patch): diagnostic only, panics 300 s after
# vfsinit with the kernel log tail on screen because ramoops is overwritten by the UEFI. Remove after.
# data-persist=2 (sheng): the 4 GiB Data seed is a "big" RAM disk (logical > 2 GiB) with no volatile mode; without
# the persistent store every write returns kIOReturnNotReady ("disk1: device is not ready", boot log 6c39b67d7).
# The store is a window just below the 1 GiB log reserve at the end of userdata (NativeUfs.cpp, guarded).
# smp=1: all eight cores, with ArmCpu's SGI IPIs. Never armcpu-spi-ipi=1 here (sheng's IPI path): a secondary core that
# pends SPI 1008 at the distributor powers the phone off under Gunyah within a fraction of a second (docs/STATE.md, 2026-11-18).
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "amfi_get_out_of_my_way=1", "log=1", "data-persist=2", "smp=1", "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "vsync=60", "vsync-fixed=1", "zeus-panic-after=300"]

[payload.runtime]
# Minimal iOS 27 runtime (sheng's [payload.runtime] without display, GPU addon,
# audio, Wi-Fi or Bluetooth): a first-install Data seed made from the IPSW OS
# volume (scripts/make-data-seed.py, as root on the Mac), Setup skipped. The
# seed is a RAM disk: Data does not persist across boots yet.
tool = "scripts/build-boot-runtime.py"
data_seed_tool = "scripts/make-data-seed.py"
target = "ios27"
build = "24A446"
data_gib = 4
skip_setup = true
gpu_addon = false
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]

[payload.install]
# sheng: the menu entry that creates the persistent Data store. A store window without this seed's header is
# left alone ("Kept") and Data then has no writable backing, so the FIRST boot must go through this entry.
title = "Install and boot"
confirm = "ERASE all iOS user data and install again?"
confirm_titles = ["Erase Data, skip Hello, boot", "Erase Data, show Hello, boot"]
confirm_args = ["data-reset=1", "data-reset=2"]

[payload.adt]
# SM8450 msm-id 457 (0x1C9), from the vendor DTS qcom,msm-id.
chip_id = "457"
# Measured /proc/iomem: the largest contiguous System RAM run is
# 0x840000000-0x97fffffff (5 GiB) with a reserved tail from 0x96ef68000.
# 0x12e000000 (4.6875 GiB) stays below that tail. 4.5 GiB since 2026-11-17: with 2 GiB the desktop boot (153
# processes, Data RAM disk in the window) ran down to 0x771 free pages and jetsam stalled. aston/sheng use 0x130000000.
owned_memory_size = "0x120000000"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[adt.defaults.u32]
# /sys/hypervisor/type = gunyah (api 1, variant 81); there is no Apple PMGR.
vmm-present = 1
sleep-disabled = 1
# kern.maxvnodes: XNU caps memsize/64k + 1024 at CONFIG_VNODES, 1024 on iOS (MASTER.arm64 xsmall); a real device lifts
# it through /defaults (PE_get_default). At 1024 memorystatus kept killing daemons ("vnode jetsam : 1024 desired,
# 1950 numvnodes") once 8 cores ran ~280 processes. 65536 as guacamole (mkadt.py); the uncapped formula gives 74752.
"kern.maxvnodes" = 65536

[adt.product.string]
# The framebuffer path is 8-bit until the panel driver lands; the panel is P3.
artwork-display-gamut = "sRGB"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-27.0.1-24A446" = "zeus_ios27_defconfig"
