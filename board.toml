schema_version = 2

[board]
name = "zeus"
soc = "SM8450"
description = "Xiaomi 12 Pro (zeus)"
# The device package is linked as kits/<kit>. build-sheng-source-storage.py
# (the sheng UFS runtime builder) hardcodes kits/sheng when it runs from the
# assembled tree, so the kit folder must carry that name; the board itself is
# zeus (Xiaomi 12 Pro), derived from obaosp/UniXNU-cupid. This only changes the package folder, not any output name.
kit = "sheng"
soc_source = "sm8450"
# iPhone-flavoured iOS 26.5.2 (23F84) profile (iOS 27 lives on branch zeus-ios27). The profile is shipped in this repository
# under profiles/os/ and installed into the UniXNU checkout by
# scripts/install-os-profile.sh; UniXNU main does not carry it yet.
os_profile = "ios-26.5.2-23F84"

[userdata]
# Measured on zeus (TWRP, root, 2026-11-16): /dev/block/by-name/userdata ->
# /dev/block/sda38, start 25362432 and size 466862040 512-byte sectors, logical
# block 4096 -> 4096-byte LBA first 3170304, count 58357755, last 61528058.
# Identical to cupid's layout.
first_lba = 3170304
last_lba = 61528058
lba_bytes = 4096


[components]
# Stage 0. ArmDTPlatform, ArmCpu and XnuPrelink also come from the arm64e arch
# profile; they are repeated here because arrays replace inherited arrays.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "AdrenoMetal"]

[kernel]
defconfig = "zeus_ios26_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-fileset-release-reference.py --tree . --lto",
  "component:ShengUfs",
  "component:RamBlock",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-26.5.2-23F84",
  # GPU: sheng's driver core without its A740 GMU platform, and the staged accelerator bound to this kernelcache (23F84 IOAcceleratorES
  # record, tools/derive-ioaccelerator-fixture.py). Inert unless gpu-power asks.
  "build-zeus-adreno.py",
  "stage-zeus-accelerator-abi.py",
  "build-adreno740-accelerator.py",
  "build-zeus-adreno.py --finish",
  # The keystore state service, built before the display archive that links its late object (as aston).
  "component:AppleKeyStoreState",
  # Display (owned GOP backend on the original 23F84 IOMobileFramebufferLegacy), keystore probe and key events, CPU frequency and
  # display timing, HID with touch and buttons, the GPU probe/pool/firmware. Apple USB returns once its 23F84 records exist.
  "build-zeus-legacy-display-26.py",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8450.config", "os:configs/ios.config"]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu-12377/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
  "device:patches/xnu-12377/series",
]

[kernel.prelink]
# The profile's roots plus the USB device and host stacks (aston's list, same iPhone17,2 fileset; docs/USB-PLAN.md).
# The iPhone17,2 fileset has no com.apple.iokit.IOHIDEventDriver bundle (the class ships in IOHIDFamily).
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily", "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice", "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC",
]

[device_tree]
source = "device:dts/zeus.dts"
include_dirs = ["soc:dts"]

[firmware]
# amethyst8118/uefi-zeus (branch zeus): obaosp's uefi-cupid fork plus zeusPkg,
# the cupidPkg platform with zeus's 1440x3200 framebuffer and identity.
# Minimal vendor-HW-off configuration on WaipioPkg (SM8450).
config = "zeus"
dsc = "Platforms/Xiaomi/zeusPkg/zeus.dsc"
fd = "Build/zeusPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Gic-Spurious masks interrupts with no registered handler (as sheng does).
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
# Binaries is deliberately absent: zeusPkg runs with ZEUS_VENDOR_HW = 0 and
# needs no stock vendor module.
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "zeus"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "zeus-ios26"

[bootimg]
dtb = "build/zeus/zeus.dtb"
# The zeus live FDT (dts/live/zeus-live.dtb) already carries
# /reserved-memory/splash_region, so no dtb_node override (fdtput refuses an
# existing node).

[payload]
volume = "ZEUSESP"
size_mib = 176
loader = "firmware"
title = "iOS 26"
dram_size = "0x80000000"
panic_screen = true
# UFS root on: the kernel takes its root from the SHNGROOT windows in userdata.
# With Android data still in userdata the driver only reads the GPT and LBA
# 3170304 and rejects the missing manifest (cupid notes/ROOT-UFS.md).
# (iOS 26 branch: the zeus-panic-after diagnostic patch is not in the series.)
# data-persist=2 (sheng): the 4 GiB Data seed is a "big" RAM disk (logical > 2 GiB) with no volatile mode; without
# the persistent store every write returns kIOReturnNotReady ("disk1: device is not ready", boot log 6c39b67d7).
# The store is a window just below the 1 GiB log reserve at the end of userdata (NativeUfs.cpp, guarded).
# smp=1: all eight cores, with ArmCpu's SGI IPIs. Never armcpu-spi-ipi=1 here (sheng's IPI path): a secondary core that
# pends SPI 1008 at the distributor powers the phone off under Gunyah within a fraction of a second (docs/STATE.md, 2026-11-18).
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "amfi_get_out_of_my_way=1", "log=1", "data-persist=2", "smp=1", "offline-key-events=1", "sheng-aks=1", "offline-hid-input=1", "offline-hid-home=1", "sheng-touch=4", "sheng-touch-hid=1", "sheng-buttons=1", "cpufreq=4", "armcpu-edge=1", "zeus-usb=1", "sched_preemption_disable_debug_mode=1", "interrupt-masked-debug-mode=1", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-transfer=1", "offline-legacy-phase=4", "vsync=60", "vsync-fixed=1", "exc-name=SpringBoard,backboardd,PosterBoard,fairplayd.H2,seputil,aonsensed,com.apple.datami", "zeus-usbeth=2", "zeusacm=1", "owner-staged-apps=1", "migration-done=1", "cryptex-os=1", "zeus-logprof=1", "msgbuf=1048576"]

[payload.runtime]
# Minimal iOS 27 runtime (sheng's [payload.runtime] without display, GPU addon,
# audio, Wi-Fi or Bluetooth): a first-install Data seed made from the IPSW OS
# volume (scripts/make-data-seed.py, as root on the Mac), Setup skipped. The
# seed is a RAM disk: Data does not persist across boots yet.
tool = "scripts/build-boot-runtime.py"
data_seed_tool = "scripts/make-data-seed.py"
target = "ios27"
build = "23F84"
data_gib = 4
skip_setup = true
gpu_addon = false
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]

[payload.install]
# sheng: the menu entry that creates the persistent Data store. A store window without this seed's header is
# left alone ("Kept") and Data then has no writable backing, so the FIRST boot must go through this entry.
title = "Install and boot"
confirm = "ERASE all iOS user data and install again?"
confirm_titles = ["Erase Data, skip Hello, boot", "Erase Data, show Hello, boot"]
confirm_args = ["data-reset=1", "data-reset=2"]

[payload.adt]
# SM8450 msm-id 457 (0x1C9), from the vendor DTS qcom,msm-id.
chip_id = "457"
# Measured /proc/iomem: the largest contiguous System RAM run is
# 0x840000000-0x97fffffff (5 GiB) with a reserved tail from 0x96ef68000.
# 0x12e000000 (4.6875 GiB) stays below that tail. 4.5 GiB since 2026-11-17: with 2 GiB the desktop boot (153
# processes, Data RAM disk in the window) ran down to 0x771 free pages and jetsam stalled. aston/sheng use 0x130000000.
owned_memory_size = "0x120000000"
# DarwinBoot lists free runs outside the window (/chosen/darwinboot-memory-outside) for the GPU pool (package/GpuMemoryPool.cpp,
# which keeps only Android's System RAM outside the window: the high bank below 0x840000000 and 0x960000000..0x96ef00000).
owned_memory_outside_ranges = 8
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[adt.defaults.u32]
# /sys/hypervisor/type = gunyah (api 1, variant 81); there is no Apple PMGR.
vmm-present = 1
sleep-disabled = 1
# kern.maxvnodes: XNU caps memsize/64k + 1024 at CONFIG_VNODES, 1024 on iOS (MASTER.arm64 xsmall); a real device lifts
# it through /defaults (PE_get_default). At 1024 memorystatus kept killing daemons ("vnode jetsam : 1024 desired,
# 1950 numvnodes") once 8 cores ran ~280 processes. 65536 as guacamole (mkadt.py); the uncapped formula gives 74752.
"kern.maxvnodes" = 65536

[adt.product.string]
# The framebuffer path is 8-bit until the panel driver lands; the panel is P3.
artwork-display-gamut = "sRGB"

[adt.product.u32]
# As aston (same iPhone17,2 profile): an edge-to-edge panel.
thin-bezel = 1

# The buttons node SpringBoard reads (as aston): home-button-type 2 = no home button, so the lock screen and the system use the
# swipe gestures of the Face ID iPhones instead of "press home". Without the node iOS treats zeus as a home-button iPhone.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-26.5.2-23F84" = "zeus_ios26_defconfig"
